# The feedstock's own variant override, submitted with the recipe.
# conda-forge builds Linux packages against glibc 2.17 by default. The worker
# and the extension link memfd_create (glibc 2.27) and statx (2.28), so a 2.17
# sysroot fails to link; 2.28 matches the PyPI manylinux_2_28 wheel and ADR 0006,
# and the package gets a __glibc >=2.28 run requirement from it.
c_stdlib_version:
  - if: linux
    then: "2.28"
