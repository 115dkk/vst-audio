[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "vst-audio"
version = "0.1.1"
description = "Isolated-process VST2/VST3 plugin hosting and offline rendering"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
authors = [{ name = "115dkk" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/115dkk/vst-audio"

[tool.maturin]
python-source = "python"
module-name = "vst_audio._native"
include = [{ path = "vst_audio/_worker/**/*", format = "wheel" }]
