[package]
name = "vst-audio-transport-sys"
description = "Platform process and shared-memory ownership for vst-audio"
keywords = ["ipc", "shared-memory", "sandbox", "process", "audio"]
categories = ["os", "os::unix-apis", "os::windows-apis", "multimedia::audio"]
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
vst-audio-ring.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
vst-audio-ring.workspace = true
