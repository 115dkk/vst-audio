[package]
name = "vst-audio-testplugin"
description = "Native fixtures for vst-audio integration tests (not distributed)"
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vst_audio_testplugin"
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[dependencies]
vst-audio-worker-sys.workspace = true
vst3.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
libc = "0.2"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBox", "NSColor", "NSView", "NSResponder", "objc2-core-foundation"] }
