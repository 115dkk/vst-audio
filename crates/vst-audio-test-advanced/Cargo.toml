[package]
name = "vst-audio-test-advanced"
description = "Native fixtures for vst-audio integration tests (not distributed)"
readme.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vst_audio_test_advanced"
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[dependencies]
vst-audio-ring.workspace = true
vst-audio-worker-sys.workspace = true
vst3.workspace = true
