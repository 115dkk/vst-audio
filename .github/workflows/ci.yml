name: CI
on:
  push:
    # main runs this workflow through release.yml, before it releases.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the release commit when called by release.yml)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain and environment
        shell: bash
        run: |
          rustup toolchain install
          rustup show
          rustc -vV
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Linux display servers
        if: runner.os == 'Linux'
        # weston and xwayland run the native Wayland editor tests under a
        # headless compositor, with and without an X server for Auto fallback.
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth weston xwayland
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Application dependency boundary
        run: python tools/check_boundary.py
      - name: Native worker and editor (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/native_tests.py
      - name: Native worker and editor (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/native_tests.py
      - name: Native editor (Linux Wayland)
        if: runner.os == 'Linux'
        run: python3 tools/wayland_tests.py
      - name: Fresh consumer of packaged crates and worker
        run: python tools/package_check.py
      - name: Release worker archive and execution (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/package_worker.py
      - name: Release worker archive and execution (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/package_worker.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-distribution-${{ matrix.os }}
          path: target/distributions/
          if-no-files-found: error
      - name: Preserve available native crash diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p test-results
          cp "$HOME"/Library/Logs/DiagnosticReports/* test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            test-results/
            target/package-check/summary.json
            target/package-check/*.log
          if-no-files-found: ignore
  gui:
    name: GUI consumers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            examples/gui -> target
          shared-key: gui
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers
      - run: cargo fmt --manifest-path examples/gui/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path examples/gui/Cargo.toml --workspace --all-targets -- -D warnings
      - name: GUI and editor lifecycle (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/gui_tests.py
      - name: GUI and editor lifecycle (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 tools/gui_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gui-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

  # A host-architecture test process drives a worker and fixtures built for
  # another architecture: 32-bit plugins on 64-bit Windows (WoW64) and Linux
  # (multilib), x86-64 plugins on Apple Silicon (Rosetta) and on ARM64 Windows
  # (emulation).
  cross:
    name: cross-architecture worker (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: i686-pc-windows-msvc
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-11-arm
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain and the worker's target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cross-${{ matrix.target }}
      - name: Linux display server and 32-bit C runtime
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth gcc-multilib
      - name: Rosetta
        if: runner.os == 'macOS'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Cross-architecture worker and fixtures (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/cross_arch_tests.py ${{ matrix.target }}
      - name: Cross-architecture worker and fixtures (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/cross_arch_tests.py ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: cross-diagnostics-${{ matrix.os }}-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore

  independent:
    name: independent plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: independent
      - if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake build-essential pkg-config libx11-dev
      - name: Build pinned upstreams and assert MIDI, DSP and negotiation
        run: python tools/third_party.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-measurements-${{ matrix.os }}
          # Explicit allowlist: no plugin, source checkout, memory dump or cache.
          path: |
            test-results/third-party/summary.json
            test-results/third-party/checks.log
          if-no-files-found: error

  extended:
    name: fuzz and AddressSanitizer (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Install pinned sanitizer and fuzz toolchain
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-10-20 --profile minimal --component rust-src
          cargo install cargo-fuzz --version 0.13.2 --locked
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: extended
      - name: Coverage-guided protocol and ring fuzzing
        run: python3 tools/fuzz_tests.py
      - name: Native worker and fixture memory checks
        run: python3 tools/asan_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extended-test-evidence
          path: |
            test-results/fuzz/
            test-results/asan/
            fuzz/artifacts/
          if-no-files-found: error
