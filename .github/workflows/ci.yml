name: CI
on:
  push:
    # main runs this workflow through release.yml, before it releases.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the release commit when called by release.yml)
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain and environment
        shell: bash
        run: |
          rustup toolchain install
          rustup show
          rustc -vV
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Linux display servers
        if: runner.os == 'Linux'
        # weston and xwayland run the native Wayland editor tests under a
        # headless compositor, with and without an X server for Auto fallback.
        # Recommends add tens of megabytes (speech models, VA drivers) that a
        # slow mirror cannot deliver within the job's time limit.
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends xvfb xauth weston xwayland
      - run: cargo fmt --all -- --check
      - name: Tool unit tests
        if: runner.os == 'Linux'
        working-directory: tools
        run: python3 -m unittest discover -p 'test_*.py'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Application dependency boundary
        run: python tools/check_boundary.py
      - name: Native worker and editor (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/native_tests.py
      - name: Native worker and editor (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/native_tests.py
      - name: Native editor (Linux Wayland)
        if: runner.os == 'Linux'
        run: python3 tools/wayland_tests.py
      - name: Fresh consumer of packaged crates and worker
        run: python tools/package_check.py
      - name: Release worker archive and execution (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/package_worker.py
      - name: Release worker archive and execution (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/package_worker.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-distribution-${{ matrix.os }}
          path: target/distributions/
          if-no-files-found: error
      - name: Preserve available native crash diagnostics
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p test-results
          cp "$HOME"/Library/Logs/DiagnosticReports/* test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            test-results/
            target/package-check/summary.json
            target/package-check/*.log
          if-no-files-found: ignore
  python:
    # The PyPI wheels release.yml publishes (ADR 0006). Each bundles the release
    # worker; the Linux wheel and its worker are built in the manylinux_2_28
    # container. The wheel is then installed into a fresh venv and tested with
    # the native fixtures, including its bundled worker.
    name: Python wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            bindings/python
      - name: Wheel (Linux, manylinux_2_28 container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/io" -w /io             quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded             bash bindings/python/build_manylinux.sh
      - name: Wheel (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/build"
          if [ "$RUNNER_OS" = Windows ]; then . "$RUNNER_TEMP/build/Scripts/activate"; else . "$RUNNER_TEMP/build/bin/activate"; fi
          pip install --quiet maturin==1.16.0
          python bindings/python/stage_worker.py
          cd bindings/python
          maturin build --locked --release --out ../../dist/python
      - name: Check metadata and test the wheel
        shell: bash
        run: |
          set -euo pipefail
          python=python3; bin="$RUNNER_TEMP/twine/bin"
          if [ "$RUNNER_OS" = Windows ]; then python=python; bin="$RUNNER_TEMP/twine/Scripts"; fi
          "$python" -m venv "$RUNNER_TEMP/twine"
          "$bin/python" -m pip install --quiet twine==7.0.0
          "$bin/python" -m twine check --strict dist/python/*.whl
          "$python" bindings/python/run_tests.py --wheel dist/python/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bindings-python-${{ matrix.os }}
          path: dist/python/
          if-no-files-found: error
  dotnet-native:
    # The C ABI library and release worker of one runtime identifier for the
    # NuGet package (ADR 0006). The Linux pair is built in the same
    # manylinux_2_28 container as the Python wheel.
    name: .NET natives (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            bindings/ffi
      - name: Natives (Linux, manylinux_2_28 container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/io" -w /io \
            quay.io/pypa/manylinux_2_28_x86_64@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded \
            bash bindings/dotnet/build_manylinux.sh
      - name: Natives (Windows, macOS)
        if: runner.os != 'Linux'
        run: python bindings/dotnet/stage_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dotnet-native-${{ matrix.rid }}
          path: bindings/dotnet/VstAudio/runtimes/
          if-no-files-found: error
  dotnet-pack:
    # One NuGet package with the natives of all four runtime identifiers. The
    # release.yml nuget job publishes this artifact.
    name: NuGet package
    needs: dotnet-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dotnet-native-*
          path: bindings/dotnet/VstAudio/runtimes
          merge-multiple: true
      - name: Pack and check the runtime assets
        run: |
          set -euo pipefail
          dotnet pack bindings/dotnet/VstAudio/VstAudio.csproj -c Release -o dist/nuget
          package=$(ls dist/nuget/VstAudio.*.nupkg)
          entries=$(unzip -Z1 "$package")
          for asset in \
            lib/net8.0/VstAudio.dll \
            runtimes/win-x64/native/vst_audio_ffi.dll \
            runtimes/win-x64/native/vst-audio-worker.exe \
            runtimes/linux-x64/native/libvst_audio_ffi.so \
            runtimes/linux-x64/native/vst-audio-worker \
            runtimes/osx-arm64/native/libvst_audio_ffi.dylib \
            runtimes/osx-arm64/native/VstAudioWorker.app/Contents/MacOS/vst-audio-worker \
            runtimes/osx-x64/native/libvst_audio_ffi.dylib \
            runtimes/osx-x64/native/VstAudioWorker.app/Contents/MacOS/vst-audio-worker; do
            grep -qxF "$asset" <<<"$entries" || { echo "::error::$package lacks $asset"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bindings-nuget
          path: dist/nuget/
          if-no-files-found: error
  dotnet-test:
    # Installs the packed package into a test project on each target and runs
    # the C ABI tests and the C# tests against the native fixtures, including
    # the package's bundled worker.
    name: .NET package (${{ matrix.os }})
    needs: dotnet-pack
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            .
            bindings/ffi
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bindings-nuget
          path: dist/nuget
      - name: C ABI and C# tests
        shell: bash
        run: |
          set -euo pipefail
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" bindings/ffi/run_tests.py
          "$python" bindings/dotnet/run_tests.py --package-dir dist/nuget
  gui:
    name: GUI consumers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Four GUI toolkits (Tauri and Slint the largest) build from scratch when
    # the cache misses.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            examples/gui -> target
          shared-key: gui
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        # WebKitGTK and GTK for Tauri, fontconfig for Slint's text, and
        # dbus-run-session for the GUI step's private session bus.
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers libwebkit2gtk-4.1-dev libgtk-3-dev libfontconfig1-dev dbus-daemon
      - run: cargo fmt --manifest-path examples/gui/Cargo.toml --all -- --check
      - run: cargo clippy --locked --manifest-path examples/gui/Cargo.toml --workspace --all-targets -- -D warnings
      - name: GUI and editor lifecycle (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/gui_tests.py
      - name: GUI and editor lifecycle (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        # A private session bus without services: the runner's portal never
        # answers, and Tauri's GTK main thread would wait 25 s for it (see
        # tools/gui-session-bus.conf).
        run: xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session --config-file=tools/gui-session-bus.conf -- python3 tools/gui_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gui-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

  # A host-architecture test process drives a worker and fixtures built for
  # another architecture: 32-bit plugins on 64-bit Windows (WoW64) and Linux
  # (multilib), x86-64 plugins on Apple Silicon (Rosetta) and on ARM64 Windows
  # (emulation).
  cross:
    name: cross-architecture worker (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: i686-pc-windows-msvc
          - os: ubuntu-24.04
            target: i686-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-11-arm
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain and the worker's target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: cross-${{ matrix.target }}
      - name: Linux display server and 32-bit C runtime
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth gcc-multilib
      - name: Rosetta
        if: runner.os == 'macOS'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Cross-architecture worker and fixtures (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/cross_arch_tests.py ${{ matrix.target }}
      - name: Cross-architecture worker and fixtures (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/cross_arch_tests.py ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: cross-diagnostics-${{ matrix.os }}-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore

  independent:
    name: independent plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: independent
      - if: runner.os == 'Linux'
        # DPF editors need X11 and OpenGL to build; Xvfb with Mesa runs them
        # and its XTEST extension delivers the synthetic mouse input. The IEM
        # suite supplies JUCE-built VST2 editors for the HiDPI check.
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake build-essential pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri xvfb xauth iem-plugin-suite-vst
      - name: Build pinned upstreams; assert MIDI, DSP, negotiation and real editor input (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/third_party.py
      - name: Build pinned upstreams; assert MIDI, DSP, negotiation and real editor input (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 tools/third_party.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-measurements-${{ matrix.os }}
          # Explicit allowlist: no plugin, source checkout, memory dump or cache.
          path: |
            test-results/third-party/summary.json
            test-results/third-party/checks.log
            test-results/third-party/mutation.log
          if-no-files-found: error

  extended:
    name: fuzz and AddressSanitizer (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - name: Install pinned sanitizer and fuzz toolchain
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-10-20 --profile minimal --component rust-src
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb xauth
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: extended
      - name: Audit workspace and GUI dependencies
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file examples/gui/Cargo.lock
      - name: Coverage-guided protocol and ring fuzzing
        run: python3 tools/fuzz_tests.py
      - name: Native worker and fixture memory checks
        run: python3 tools/asan_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extended-test-evidence
          path: |
            test-results/fuzz/
            test-results/asan/
            fuzz/artifacts/
          if-no-files-found: error
