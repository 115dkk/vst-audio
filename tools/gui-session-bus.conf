<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A session bus without activatable services, for the Linux GUI smoke
     (passed to dbus-run-session as its config file; see ci.yml). GTK and
     WebKitGTK read desktop settings
     through xdg-desktop-portal synchronously on the main thread. On a hosted
     runner the portal is a systemd user service that never starts without a
     graphical session, so that call blocked the Tauri example for the 25 s
     D-Bus timeout and its smoke ran out of time. Here the lookups fail at
     once, as on a machine without a session bus. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
