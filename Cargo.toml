[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/115dkk/vst-audio"
publish = true
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
dbg_macro = "deny"

[workspace.dependencies]
vst-audio = { path = "crates/vst-audio", version = "=0.1.0" }
vst-audio-ring = { path = "crates/vst-audio-ring", version = "=0.1.0" }
vst-audio-protocol = { path = "crates/vst-audio-protocol", version = "=0.1.0" }
vst-audio-worker-sys = { path = "crates/vst-audio-worker-sys", version = "=0.1.0" }
vst-audio-transport-sys = { path = "crates/vst-audio-transport-sys", version = "=0.1.0" }
vst-audio-worker-runtime = { path = "crates/vst-audio-worker-runtime", version = "=0.1.0" }
vst3 = "=0.3.0"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
assert_no_alloc = { version = "1.1.2", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading",
    "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Media_Audio"
] }

[profile.release]
lto = "thin"
codegen-units = 1
